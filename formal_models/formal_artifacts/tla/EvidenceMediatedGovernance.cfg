\* TLC configuration for EvidenceMediatedGovernance.tla
\* Run with: java -jar tla2tools.jar -config EvidenceMediatedGovernance.cfg EvidenceMediatedGovernance.tla

CONSTANTS
    RiskSignals = {r1, r2}
    MaxSteps = 5

SPECIFICATION Spec

\* The safety half of the Until property, checked as an invariant-style
\* temporal property (TLC checks `[]P` formulas directly when listed under
\* PROPERTY).
PROPERTY EvidenceMediationSafety

\* The liveness half: confirms the model isn't vacuously satisfying the
\* safety property by never reviewing anything.
PROPERTY ReviewEventuallyHappens
