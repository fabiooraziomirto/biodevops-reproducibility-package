\* TLC configuration for EvidenceMediatedGovernance_Broken.tla
\* Run with: java -jar tla2tools.jar -config EvidenceMediatedGovernance_Broken.cfg EvidenceMediatedGovernance_Broken.tla
\*
\* EXPECTED OUTCOME: TLC reports an INVARIANT VIOLATION with a concrete
\* error trace showing a state where some risk signal is pending and
\* unreviewed while authorized = TRUE. If TLC instead reports "no error
\* found," the negative control has FAILED and the main result must not
\* be trusted without further investigation.

CONSTANTS
    RiskSignals = {r1, r2}
    MaxSteps = 5

SPECIFICATION Spec

\* Checked as an INVARIANT here (not PROPERTY) because for the broken
\* model we only need TLC to search the reachable state graph for any
\* single violating state -- full LTL property checking with fairness is
\* unnecessary machinery for a "does a bad state exist" question, and
\* invariant checking is the more standard TLC idiom for that question.
INVARIANT EvidenceMediationSafetyAsInvariant
